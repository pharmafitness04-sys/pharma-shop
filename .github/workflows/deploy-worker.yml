name: Deploy PHARMA SHOP checkout Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          PRODUCT_CATALOG_JSON: ${{ secrets.PRODUCT_CATALOG_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$MP_ACCESS_TOKEN" || (echo "Missing GitHub Actions secret: MP_ACCESS_TOKEN" && exit 1)
          test -n "$PRODUCT_CATALOG_JSON" || (echo "Missing GitHub Actions secret: PRODUCT_CATALOG_JSON" && exit 1)
          npx --yes wrangler@4 secret put MP_ACCESS_TOKEN <<< "$MP_ACCESS_TOKEN"
          npx --yes wrangler@4 secret put PRODUCT_CATALOG_JSON <<< "$PRODUCT_CATALOG_JSON"

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
